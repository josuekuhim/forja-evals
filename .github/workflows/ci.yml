name: ci
# Manual trigger for now; restore `on: [push, pull_request]` to run on every push.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # forja-contracts vem do repo hub; em CI, aponte o [tool.uv.sources] para o git (ver pyproject).
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/forja
          path: _forja
      - run: mv _forja ../forja
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q
