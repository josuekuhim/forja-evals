# Modelo base em CPU via llama-server (GGUF Q4_K_M), só métricas determinísticas.
# explicacao e api ficam sem nota até o juiz entrar (configs/qwen-base-local.yaml).
nome: qwen2.5-coder-1.5b-q4km-cpu+prompt
dataset: datasets/forja-seed-v0
modelo:
  base_url: http://127.0.0.1:8000/v1
  model: Qwen/Qwen2.5-Coder-1.5B-Instruct
  extra_body:
    cache_prompt: false   # reuso do KV cache do system prompt muda a saída (ver README: determinismo)
geracao:
  temperature: 0.0
  max_tokens: 1024
  seed: 0
concorrencia: 1   # = --parallel do llama-server; >1 tira o determinismo em CPU
cache: null       # baseline sempre sem cache de respostas
