# Modelo base em CPU (porta 8000) + juiz local Gemma 4 26B-A4B (porta 8001), ambos via llama-server.
# Juiz local: grátis e reprodutível, mas precisa ser calibrado (forja-evals label + kappa) antes de valer.
nome: qwen2.5-coder-1.5b-q4km-cpu+prompt
dataset: datasets/forja-seed-v0
modelo:
  base_url: http://127.0.0.1:8000/v1
  model: Qwen/Qwen2.5-Coder-1.5B-Instruct
  extra_body:
    cache_prompt: false
geracao:
  temperature: 0.0
  max_tokens: 1024
  seed: 0
juiz:
  base_url: http://127.0.0.1:8001/v1
  model: ggml-org/gemma-4-26B-A4B-it-Q4_0
  extra_body:
    cache_prompt: false
juiz_geracao:
  temperature: 0.0
  # O Gemma 4 raciocina antes do JSON: até ~1.300 tokens num caso simples (a ~8 tok/s em CPU).
  # Com 2048 um caso difícil corta o raciocínio e o juiz fica sem nota.
  max_tokens: 4096
  seed: 0
concorrencia: 1
# 4096 tokens a ~8 tok/s = ~8,5 min no pior caso; com 120 s o juiz era cancelado e repetia em loop.
juiz_timeout_s: 900
cache: null
