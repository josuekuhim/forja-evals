# Baseline externo: modelo grande via API com o mesmo prompt. É a "referência" da tabela do hub.
nome: referencia-api
dataset: datasets/forja-seed-v0
modelo:
  base_url: https://openrouter.ai/api/v1
  model: anthropic/claude-sonnet-5.5
  api_key_env: OPENROUTER_API_KEY
